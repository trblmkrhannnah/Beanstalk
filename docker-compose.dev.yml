services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: beanstalk
      POSTGRES_USER: beanstalk
      POSTGRES_PASSWORD: beanstalk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beanstalk"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - ./db-data:/var/lib/postgresql/data

