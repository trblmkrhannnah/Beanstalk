services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: beanstalk
      POSTGRES_USER: beanstalk
      POSTGRES_PASSWORD: beanstalk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beanstalk"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    image: beanstalk-app:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Database=beanstalk;Username=beanstalk;Password=beanstalk
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

